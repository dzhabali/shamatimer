name: ShamaTimer
options:
  bundleIdPrefix: com.maxdzhabali
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # страховка от дефолтов шаблонов Xcode 26 (MainActor по умолчанию / строгая concurrency)
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_STRICT_CONCURRENCY: minimal
    # Team ID аккаунта Diamond Wisdom Group OU (не секрет)
    DEVELOPMENT_TEAM: F8H3UK3UF7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  ShamaTimer:
    type: application
    platform: iOS
    sources:
      - path: ShamaTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdzhabali.shamatimer
        PRODUCT_NAME: ShamaTimer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: ShamaTimer/ShamaTimer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: ShamaTimer/Info.plist
      properties:
        CFBundleDisplayName: Shama
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UIAppFonts:
          - CormorantGaramond-Light.ttf
          - CormorantGaramond-LightItalic.ttf
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthUpdateUsageDescription: Shama saves your meditation sessions to Apple Health as Mindful Minutes.
        NSHealthShareUsageDescription: Shama only writes Mindful Minutes and does not read your health data.
    scheme:
      testTargets:
        - ShamaTimerTests

  ShamaTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShamaTimerTests
    dependencies:
      - target: ShamaTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdzhabali.shamatimer.tests
        GENERATE_INFOPLIST_FILE: YES
